<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>EatSwada – Food Near You</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<!-- Switched to Manrope for a more space-efficient, native-app feel -->
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>
<style>
  /* ══════════════════════════════════════════════════════════════
     1. BASE
     One continuous page background. Sections do not paint their own
     backgrounds — separation comes from spacing and from the cards.
     ══════════════════════════════════════════════════════════════ */
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --page-bg:      #FFFFFF;
    --surface:      #FFFFFF;
    --text:         #171A20;
    --text-soft:    #5B6472;
    --text-mute:    #8A93A2;
    --line:         #E3E6EB;
    --brand:        #FC8019;
    --brand-ink:    #0F172A;
  }

  html { background: var(--page-bg); }

  body {
    margin: 0;
    font-family: 'Manrope', system-ui, -apple-system, sans-serif;
    background: var(--page-bg);
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
    padding-bottom: 110px;
  }

  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  .tap { transition: transform .13s ease, opacity .13s ease; cursor: pointer; }
  .tap:active { transform: scale(.96); opacity: .85; }

  @keyframes cardFadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ══════════════════════════════════════════════════════════════
     2. SKELETONS
     ══════════════════════════════════════════════════════════════ */
  @keyframes shimmer {
    0%   { background-position: -600px 0; }
    100% { background-position:  600px 0; }
  }

  .sk {
    display: block;
    background: linear-gradient(90deg, #E7E9ED 25%, #F3F4F7 50%, #E7E9ED 75%);
    background-size: 1200px 100%;
    animation: shimmer 1.5s infinite linear;
    border-radius: 10px;
  }
  .sk.d1 { animation-delay: .08s; }
  .sk.d2 { animation-delay: .16s; }
  .sk.d3 { animation-delay: .24s; }
  .sk.d4 { animation-delay: .32s; }

  .cs-item { display: flex; flex-direction: column; align-items: center; width: 100%; }
  .cs-ring { width: 100%; aspect-ratio: 1/1; border-radius: 50%; }
  .cs-name { width: 70%; height: 11px; margin-top: 8px; border-radius: 5px; }

  /* ══════════════════════════════════════════════════════════════
     3. EATSWADA HEADER — CLEAN / FLOATING / THEME SYSTEM
     Only this header is theme-aware. Everything below stays intact.
     ══════════════════════════════════════════════════════════════ */
  .hero-header {
    --hero-bg:#C50057;
    --hero-bg-2:#8E003E;
    --hero-ink:#FFFFFF;
    --hero-muted:rgba(255,255,255,.76);
    --hero-accent:#FFD35A;
    background:linear-gradient(145deg,var(--hero-bg) 0%,var(--hero-bg-2) 100%);
    color:var(--hero-ink);
    border-bottom-left-radius:28px;
    border-bottom-right-radius:28px;
    padding:14px 16px 0;
    position:relative;
    z-index:10;
    isolation:isolate;
    overflow:hidden;
    box-shadow:0 18px 38px -24px rgba(15,23,42,.48);
    transition:transform .48s cubic-bezier(.22,1,.36,1),opacity .48s ease,box-shadow .7s ease,color .4s ease;
  }
  .hero-header[data-theme="pink"]{--hero-bg:#D20A61;--hero-bg-2:#9B0045;--hero-accent:#FFD45C;}
  .hero-header[data-theme="lavender"]{--hero-bg:#8060D8;--hero-bg-2:#5837A8;--hero-accent:#FFE37A;}
  .hero-header[data-theme="magenta"]{--hero-bg:#B80057;--hero-bg-2:#730035;--hero-accent:#FFDE69;}
  .hero-header[data-theme="anime"]{--hero-bg:#FFF;--hero-bg-2:#FFF;--hero-ink:#1F2430;--hero-muted:#697386;--hero-accent:#D20A61;box-shadow:0 18px 38px -26px rgba(15,23,42,.30);}

  .hero-header::before{
    content:"";position:absolute;inset:-40px -20px auto;height:220px;pointer-events:none;z-index:0;
    background:
      radial-gradient(circle at 8% 12%,rgba(255,255,255,.17),transparent 26%),
      radial-gradient(circle at 78% 0%,rgba(255,255,255,.13),transparent 25%),
      radial-gradient(circle at 45% 75%,rgba(255,255,255,.07),transparent 32%);
    opacity:1;transition:opacity .5s ease;
  }
  .hero-header::after{
    content:"";position:absolute;right:-42px;top:28px;width:170px;height:170px;border-radius:50%;
    border:1px solid rgba(255,255,255,.12);box-shadow:0 0 0 28px rgba(255,255,255,.025),0 0 0 56px rgba(255,255,255,.018);
    pointer-events:none;z-index:0;
  }
  .hero-header[data-theme="anime"]::before{
    background:radial-gradient(circle at 74% 18%,rgba(255,182,205,.22),transparent 30%),radial-gradient(circle at 18% 10%,rgba(218,225,255,.34),transparent 28%);
  }
  .hero-header[data-theme="anime"]::after{display:none;}
  .hero-header > *{position:relative;z-index:2;}

  /* Anime artwork: clean white, no text, sits behind the controls on the right. */
  .hero-header[data-theme="anime"] .anime-art{
    display:block;position:absolute;right:-8px;top:0;width:48%;height:184px;object-fit:cover;object-position:center top;
    mix-blend-mode:multiply;opacity:.92;z-index:1;pointer-events:none;
    filter:saturate(.92) contrast(.98);
  }
  .anime-art{display:none;}

  /* Future header themes enter horizontally, never by colour cross-fade. */
  .hero-header.theme-slide-next{animation:esHeaderSlideNext .48s cubic-bezier(.22,1,.36,1) both;}
  .hero-header.theme-slide-prev{animation:esHeaderSlidePrev .48s cubic-bezier(.22,1,.36,1) both;}
  @keyframes esHeaderSlideNext{from{opacity:.35;transform:translateX(34px)}to{opacity:1;transform:translateX(0)}}
  @keyframes esHeaderSlidePrev{from{opacity:.35;transform:translateX(-34px)}to{opacity:1;transform:translateX(0)}}

  @keyframes esHeaderEnter{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
  .hero-header{animation:esHeaderEnter .55s cubic-bezier(.22,1,.36,1) both;}
  .es-header-item{opacity:0;transform:translateY(7px);animation:esHeaderItem .5s cubic-bezier(.22,1,.36,1) forwards;}
  .es-header-item:nth-child(1){animation-delay:.06s}.es-header-item:nth-child(2){animation-delay:.12s}.es-header-item:nth-child(3){animation-delay:.18s}
  @keyframes esHeaderItem{to{opacity:1;transform:none}}

  .hero-header .loc-left:focus-visible,.hero-header .btn-store:focus-visible,.hero-header .btn-profile:focus-visible,
  .hero-header .search-box:focus-visible,.hero-header .veg-box:focus-visible,.hero-header .banner-cta:focus-visible,
  .hero-header .banner-arrow:focus-visible{outline:2px solid var(--hero-accent);outline-offset:3px;}

  .loc-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px;gap:10px;}
  .loc-left{flex:1;min-width:0;padding-right:4px;text-decoration:none;display:flex;flex-direction:column;justify-content:center;}
  .loc-sub{font-size:11px;font-weight:700;color:var(--hero-muted);letter-spacing:.05px;line-height:17px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .loc-name-row{display:flex;align-items:center;gap:6px;margin-top:1px;max-width:100%;}
  .loc-arrow{font-size:11px;color:var(--hero-accent);flex-shrink:0;}
  .loc-name{font-size:15px;font-weight:850;color:var(--hero-ink);line-height:21px;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:100%;}
  .loc-chevron{font-size:9px;color:var(--hero-muted);flex-shrink:0;transition:transform .18s ease;}
  .loc-left:active .loc-chevron{transform:translateY(1px)}
  .loc-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}

  .btn-store{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:var(--hero-ink);border-radius:15px;min-height:40px;padding:0 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;flex-shrink:0;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 20px -15px rgba(0,0,0,.7);transition:transform .2s ease,background .2s ease,border-color .2s ease;}
  .btn-store:active{transform:scale(.96);background:rgba(255,255,255,.2);}
  .store-top{font-size:8px;font-weight:850;color:var(--hero-muted);text-transform:uppercase;letter-spacing:.7px;line-height:1;}
  .store-bot{font-size:14px;font-weight:900;color:var(--hero-accent);line-height:1.25;}

  .btn-profile{width:40px;height:40px;background:#fff;color:#1F2937;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;text-decoration:none;flex-shrink:0;box-shadow:0 9px 20px -10px rgba(0,0,0,.42);transition:transform .2s ease;}
  .btn-profile:active{transform:scale(.95)}
  .btn-profile i{font-size:14px;color:#1F2937}.profile-initial{font-weight:900;font-size:15px;color:#B80057}

  .search-row{display:flex;gap:9px;margin-bottom:11px;}
  .search-box{flex:1;min-width:0;background:#fff;border-radius:17px;height:50px;display:flex;align-items:center;padding:0 15px;gap:10px;border:1px solid rgba(255,255,255,.96);box-shadow:0 11px 24px -15px rgba(0,0,0,.5);text-decoration:none;overflow:hidden;transition:transform .2s ease,box-shadow .2s ease;}
  .search-box:active{transform:scale(.985);box-shadow:0 6px 16px -11px rgba(0,0,0,.4)}
  .search-icon{font-size:16px;color:#667085;flex-shrink:0}.search-text{color:#667085;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .veg-box{width:68px;height:50px;border:1px solid rgba(255,255,255,.78);border-radius:17px;background:rgba(255,255,255,.97);color:#334155;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;flex-shrink:0;cursor:pointer;box-shadow:0 10px 20px -15px rgba(0,0,0,.45);}
  .veg-label-txt{font-size:8px;font-weight:900;letter-spacing:1px}.veg-track{width:28px;height:14px;border-radius:99px;background:#E2E8F0;position:relative;transition:background .25s ease}.veg-track.on{background:#DCFCE7}.veg-thumb{width:14px;height:14px;position:absolute;left:0;top:0;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(15,23,42,.16);transition:transform .25s cubic-bezier(.34,1.56,.64,1);display:flex;align-items:center;justify-content:center}.veg-track.on .veg-thumb{transform:translateX(14px)}.veg-inner{width:6px;height:6px;border:1.5px solid #16A34A;border-radius:2px;display:flex;align-items:center;justify-content:center}.veg-inner-dot{width:3px;height:3px;background:#16A34A;border-radius:50%}

  /* Existing admin-controlled banner stays in place; only its visual treatment is tuned. */
  .banner-wrap{position:relative;min-height:188px;padding:4px 0 14px;}
  .banner-carousel{position:relative;min-height:174px;}
  .banner-slide{position:absolute;inset:0;border-radius:21px;overflow:hidden;isolation:isolate;background:var(--banner-bg,#A6004B);box-shadow:0 18px 30px -22px rgba(0,0,0,.58);opacity:0;pointer-events:none;transform:translateX(10px) scale(.99);transition:opacity .4s ease,transform .5s cubic-bezier(.22,1,.36,1);}
  .banner-slide.is-active{opacity:1;pointer-events:auto;transform:none}.banner-slide.is-leaving{opacity:0;transform:translateX(-10px) scale(.99)}
  .banner-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}.banner-shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(0,0,0,.68) 0%,rgba(0,0,0,.35) 44%,rgba(0,0,0,.04) 100%)}.banner-slide.text-dark .banner-shade{background:linear-gradient(90deg,rgba(255,255,255,.8),rgba(255,255,255,.22) 54%,rgba(255,255,255,.02))}.banner-copy{position:absolute;left:20px;top:18px;bottom:18px;max-width:72%;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;color:#fff}.banner-slide.text-dark .banner-copy{color:#0F172A}.banner-badge{display:inline-flex;align-items:center;min-height:22px;padding:0 9px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:8px;font-weight:900;letter-spacing:1px;text-transform:uppercase}.banner-slide.text-dark .banner-badge{background:rgba(15,23,42,.08);border-color:rgba(15,23,42,.12)}.banner-title{margin:9px 0 0;font-size:clamp(23px,6.5vw,30px);line-height:1.02;letter-spacing:-.75px;font-weight:900}.banner-subtitle{margin:7px 0 0;font-size:11px;line-height:1.4;font-weight:600;opacity:.9;max-width:34ch}.banner-offer{margin:8px 0 0;font-size:13px;line-height:1.2;font-weight:900}.banner-cta{margin-top:12px;display:inline-flex;align-items:center;gap:8px;min-height:34px;padding:0 13px;border-radius:11px;background:var(--hero-accent);color:#241321;font-size:11px;font-weight:900;text-decoration:none;box-shadow:0 8px 18px -12px rgba(0,0,0,.65);transition:transform .2s ease,box-shadow .2s ease}.banner-cta:active{transform:translateY(1px) scale(.98)}.banner-cta i{font-size:9px}.banner-controls{position:absolute;left:20px;bottom:23px;display:flex;align-items:center;gap:5px;z-index:4}.banner-dot{width:5px;height:5px;border:0;padding:0;border-radius:50%;background:rgba(255,255,255,.42);transition:width .25s ease,background .25s ease}.banner-dot.is-active{width:17px;border-radius:99px;background:var(--hero-accent)}.banner-arrow{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border:1px solid rgba(255,255,255,.2);border-radius:50%;background:rgba(0,0,0,.18);color:#fff;display:grid;place-items:center;z-index:5;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}.banner-arrow.prev{left:8px}.banner-arrow.next{right:8px}.banner-arrow i{font-size:10px}
  .banner-slide[data-animation="slide"] .banner-copy>*{opacity:0;transform:translateY(10px)}.banner-slide.is-active[data-animation="slide"] .banner-copy>*{animation:bannerCopyIn .55s cubic-bezier(.22,1,.36,1) forwards}.banner-slide.is-active[data-animation="slide"] .banner-copy>*:nth-child(2){animation-delay:.05s}.banner-slide.is-active[data-animation="slide"] .banner-copy>*:nth-child(3){animation-delay:.1s}.banner-slide.is-active[data-animation="slide"] .banner-copy>*:nth-child(4){animation-delay:.15s}@keyframes bannerCopyIn{to{opacity:1;transform:none}}.banner-slide[data-animation="scale"] .banner-image{transform:scale(1.06);transition:transform 5s ease}.banner-slide.is-active[data-animation="scale"] .banner-image{transform:scale(1)}
  .banner-loading{min-height:174px;border-radius:21px;background:linear-gradient(110deg,rgba(255,255,255,.09) 8%,rgba(255,255,255,.18) 18%,rgba(255,255,255,.09) 33%);background-size:200% 100%;animation:bannerShimmer 1.25s linear infinite}@keyframes bannerShimmer{to{background-position:-200% 0}}.banner-fallback{min-height:174px;border-radius:21px;padding:24px 20px;display:flex;flex-direction:column;justify-content:center;color:#fff;background:linear-gradient(135deg,#B80057,#700034)}.banner-fallback strong{font-size:25px;line-height:1.05;letter-spacing:-.7px}.banner-fallback span{margin-top:8px;font-size:12px;opacity:.78}
  @media(max-width:380px){.banner-copy{max-width:78%;left:16px}.banner-title{font-size:22px}.banner-subtitle{font-size:10px}.banner-wrap{min-height:178px}.banner-carousel,.banner-loading,.banner-fallback,.banner-slide{min-height:164px}.hero-header[data-theme="anime"] .anime-art{width:50%;height:174px;right:-10px;}}
  @media(prefers-reduced-motion:reduce){.hero-header,.es-header-item,.banner-slide,.banner-image{animation:none!important;transition:none!important}.theme-transition{transition:none!important}}

  /* ══════════════════════════════════════════════════════════════
     4. PAGE SECTIONS — shared, transparent, one background
     ══════════════════════════════════════════════════════════════ */
  .page { padding-top: 4px; }

  .section { padding: 20px 0 4px; }
  .section[hidden] { display: none; }

  .sec-head { display: flex; align-items: center; gap: 12px; padding: 0 18px; margin-bottom: 14px; }

  /* Upgraded to Zomato-style section titles */
  .sec-title {
    margin: 0;
    font-size: 12px;
    font-weight: 700;
    color: #64748B;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .sec-head::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  /* ── What's on your mind ── */
  .cat-scroll {
    display: grid;
    grid-template-rows: repeat(2, auto);
    grid-auto-flow: column;
    grid-auto-columns: 25vw;
    justify-content: start;
    gap: 18px 14px;
    padding: 4px 18px 20px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
    scroll-snap-type: x proximity;
    overscroll-behavior-x: contain;
  }
  @media (min-width: 620px) { .cat-scroll { grid-auto-columns: 120px; } }

  .cat-item {
    display: flex; flex-direction: column; align-items: center; width: 100%;
    text-decoration: none; scroll-snap-align: start;
    -webkit-tap-highlight-color: transparent;
    transition: transform .18s ease, opacity .18s ease;
  }
  .cat-item:active { transform: scale(.93); opacity: .8; }

  .cat-ring { width: 100%; aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
  .cat-ring img { width: 100%; height: 100%; object-fit: contain; transform: scale(1.2); opacity: 0; transition: opacity .25s ease; }
  .cat-ring img.loaded { opacity: 1; }

  .cat-name { font-size: 14px; font-weight: 700; color: #2A2F3A; text-align: center; line-height: 1.2; }

  /* ── Filter bar ── */
  .filter-bar {
    display: flex; gap: 8px; overflow-x: auto;
    padding: 4px 18px 16px;
    scrollbar-width: none;
    background: transparent;
  }
  .filter-bar[hidden] { display: none; }
  .filter-bar::-webkit-scrollbar { display: none; }

  .filter-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 14px; flex-shrink: 0;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    font-family: inherit; font-size: 14px; font-weight: 600; color: #3B4453;
    white-space: nowrap; cursor: pointer;
    box-shadow: 0 1px 2px rgba(15,23,42,.04);
    transition: background .18s ease, border-color .18s ease, color .18s ease, transform .12s ease;
  }
  .filter-pill:active { transform: scale(.95); }
  .filter-pill.active {
    background: #FFF3E8;
    color: #C2560A;
    border-color: var(--brand);
    box-shadow: none;
  }
  .filter-count {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 18px; height: 18px; padding: 0 5px; margin-left: 2px;
    border-radius: 9px; background: var(--brand); color: #fff;
    font-size: 11px; font-weight: 800;
  }

  /* ── Refresh notice ── */
  #home-notice {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin: 0 18px 14px; padding: 10px 14px;
    background: #FFF8EC; border: 1px solid #F6DFBE; border-radius: 12px;
    font-size: 13px; font-weight: 600; color: #8A5A12;
  }
  #home-notice[hidden] { display: none; }
  .notice-retry {
    border: none; background: transparent; color: #B45309;
    font-family: inherit; font-size: 13px; font-weight: 800;
    text-decoration: underline; cursor: pointer; flex-shrink: 0; padding: 0;
  }

  /* ── Empty / error blocks ── */
  .state-block { text-align: center; padding: 44px 24px 52px; }
  .state-icon { font-size: 40px; color: #C3C9D4; display: block; margin-bottom: 14px; }
  .state-title { font-size: 16px; font-weight: 800; color: #303845; margin: 0 0 6px; }
  .state-sub { font-size: 13px; font-weight: 500; color: var(--text-soft); margin: 0 0 18px; line-height: 1.5; }
  .state-btn {
    background: var(--brand); color: #fff; border: none;
    padding: 12px 26px; border-radius: 12px;
    font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer;
  }
  .state-btn:active { transform: scale(.97); }
  .state-btn:disabled { opacity: .6; cursor: default; }

  /* ══════════════════════════════════════════════════════════════
     5. FILTER SHEET
     ══════════════════════════════════════════════════════════════ */
  .filter-sheet { position: fixed; inset: 0; z-index: 100001; }
  .filter-sheet[hidden] { display: none; }

  .sheet-backdrop {
    position: absolute; inset: 0; background: rgba(15,23,42,.45);
    opacity: 0; transition: opacity .22s ease;
  }
  .filter-sheet.open .sheet-backdrop { opacity: 1; }

  .sheet-panel {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: var(--surface); border-radius: 22px 22px 0 0;
    padding: 8px 20px calc(24px + env(safe-area-inset-bottom, 0px));
    max-height: 78vh; overflow-y: auto;
    transform: translateY(100%); transition: transform .24s cubic-bezier(.22,1,.36,1);
  }
  .filter-sheet.open .sheet-panel { transform: translateY(0); }

  .sheet-grabber { width: 40px; height: 4px; border-radius: 2px; background: #DEE2E8; margin: 6px auto 14px; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .sheet-title { font-size: 18px; font-weight: 800; margin: 0; color: var(--text); }
  .sheet-clear {
    border: none; background: transparent; color: var(--brand);
    font-family: inherit; font-size: 13px; font-weight: 800; cursor: pointer; padding: 4px;
  }
  .sheet-group-title {
    font-size: 12px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase;
    color: var(--text-mute); margin: 18px 0 8px;
  }
  .sheet-options { display: flex; flex-direction: column; }
  .sheet-option {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; padding: 14px 2px; border: none; border-bottom: 1px solid #F1F2F5;
    background: transparent; font-family: inherit; font-size: 15px; font-weight: 600;
    color: #333A45; text-align: left; cursor: pointer;
  }
  .sheet-option i { color: var(--brand); opacity: 0; font-size: 14px; }
  .sheet-option.selected { color: #C2560A; font-weight: 800; }
  .sheet-option.selected i { opacity: 1; }
  .sheet-done {
    width: 100%; margin-top: 20px; padding: 15px;
    background: var(--brand-ink); color: #fff; border: none; border-radius: 14px;
    font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer;
  }

  /* ══════════════════════════════════════════════════════════════
     6. LOCATION — permission sheet, status banner, card availability
     Additive only. Reuses the sheet shell, tokens and type above so
     the existing Home layout is untouched.
     ══════════════════════════════════════════════════════════════ */
  .loc-sheet { position: fixed; inset: 0; z-index: 100002; }
  .loc-sheet[hidden] { display: none; }
  .loc-sheet .sheet-backdrop { opacity: 0; transition: opacity .22s ease; }
  .loc-sheet.open .sheet-backdrop { opacity: 1; }
  .loc-sheet .sheet-panel {
    transform: translateY(100%);
    transition: transform .24s cubic-bezier(.22,1,.36,1);
    padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  }
  .loc-sheet.open .sheet-panel { transform: translateY(0); }

  .loc-sheet-pin {
    width: 46px; height: 46px; border-radius: 50%;
    background: #FFF3E8; color: #C2560A;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; margin: 4px 0 12px;
  }
  .loc-sheet-title { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; color: var(--text); margin: 0 0 8px; }
  .loc-sheet-text { font-size: 14px; font-weight: 500; line-height: 1.55; color: var(--text-soft); margin: 0 0 20px; }

  .loc-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; min-height: 50px; padding: 14px 16px; margin-bottom: 10px;
    border-radius: 14px; font-family: inherit; font-size: 15px; font-weight: 800;
    cursor: pointer; text-decoration: none; border: none;
  }
  .loc-btn:active { transform: scale(.98); }
  .loc-btn-primary { background: var(--brand); color: #fff; }
  .loc-btn-primary:disabled { opacity: .65; cursor: default; transform: none; }
  .loc-btn-secondary { background: var(--surface); color: #333A45; border: 1px solid var(--line); }
  .loc-btn-quiet {
    background: transparent; border: none; color: var(--text-mute);
    font-family: inherit; font-size: 14px; font-weight: 700;
    width: 100%; min-height: 44px; margin-bottom: 0; cursor: pointer;
  }
  .loc-sheet .loc-btn:focus-visible,
  .loc-sheet .loc-btn-quiet:focus-visible { outline: 2px solid var(--brand-ink); outline-offset: 2px; }

  /* ── Location status banner (above the restaurant list) ── */
  #location-banner {
    display: flex; align-items: center; gap: 12px;
    margin: 0 18px 14px; padding: 12px 14px;
    background: #F6F7F9; border: 1px solid var(--line); border-radius: 12px;
  }
  #location-banner[hidden] { display: none; }
  .lb-icon { font-size: 14px; color: #8A93A2; flex-shrink: 0; }
  .lb-text { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; color: #3B4453; line-height: 1.45; }
  .lb-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .lb-btn {
    border: none; background: transparent; color: #C2560A;
    font-family: inherit; font-size: 13px; font-weight: 800;
    text-decoration: underline; cursor: pointer;
    padding: 10px 6px; min-height: 40px; white-space: nowrap;
  }
  .lb-btn:disabled { color: var(--text-mute); text-decoration: none; cursor: default; }

  /* Per-card delivery status is not styled here — restaurant-card.css
     already owns .es-card.is-unavailable, .es-availability-overlay and
     the toast. */

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
  }
</style>

<script>
(() => {
  "use strict";
  const header = document.getElementById("home-header");
  if (!header) return;

  // Phase 1: Anime header only.
  // The theme system is intentionally swipe-ready so the future 4-header
  // rotation can move horizontally instead of fading between colours.
  header.dataset.theme = "anime";
  header.dataset.headerIndex = "0";

  let touchStartX = 0;
  let touchStartY = 0;
  let tracking = false;

  header.addEventListener("touchstart", (e) => {
    const t = e.changedTouches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
    tracking = true;
  }, { passive: true });

  header.addEventListener("touchend", (e) => {
    if (!tracking) return;
    tracking = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    if (Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy)) return;

    // No theme switch yet: only Anime is enabled in this first rollout.
    // Future admin-enabled themes will use the same horizontal swipe hook.
  }, { passive: true });
})();
</script>
