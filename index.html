<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>EatSwada Rider — Dashboard</title>
<style>
/* ===================================================================
   Nearbite Rider Dashboard
   Same system as Rider Login:
   Palette: asphalt charcoal + signal-lime accent (traffic-light "go")
   Type:    Sora (display) / Inter (body) / JetBrains Mono (digits)
   Signature element carried over from login: the dashed "route" line.
   Here it becomes the connector between restaurant → customer inside
   the active order card — the actual route the rider is running.
   =================================================================== */

@import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap');

:root {
  --bg:            #14171C;
  --surface:       #1D2229;
  --surface-raised:#242A32;
  --border:        #2B323C;
  --text:          #F3F1EA;
  --text-dim:      #9BA3AF;
  --accent:        #C8FF4D;
  --accent-dim:    #9CCB33;
  --accent-bg:     rgba(200,255,77,0.1);
  --error:         #FF6B5E;
  --error-bg:      rgba(255, 107, 94, 0.1);

  --font-display: 'Sora', sans-serif;
  --font-body:    'Inter', sans-serif;
  --font-mono:    'JetBrains Mono', monospace;

  --radius: 14px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: contain;
}

button { font-family: inherit; }

a { color: inherit; text-decoration: none; }

.is-hidden { display: none !important; }

.toggle-visibility:focus-visible,
input:focus-visible,
button:focus-visible,
a:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* ---------- App shell ---------- */
.app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  position: relative;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(600px 300px at 50% -10%, rgba(200,255,77,0.06), transparent 70%),
    var(--bg);
}

/* ---------- Top bar ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  background: rgba(20,23,28,0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.topbar-left { display: flex; align-items: center; gap: 10px; }
.brand-mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  border-radius: 9px;
  background: var(--accent);
  color: #10130F;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 18px;
  flex-shrink: 0;
}
.topbar-title h1 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.02em;
}
.topbar-title p {
  margin: 0;
  font-size: 11px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.12em;
}
.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: var(--surface-raised);
  border: 1px solid var(--border);
  color: var(--text-dim);
  cursor: pointer;
  transition: color 0.15s ease, border-color 0.15s ease, transform 0.05s ease;
}
.icon-btn:hover { color: var(--text); border-color: #3a4250; }
.icon-btn:active { transform: scale(0.94); }

/* ---------- Mini route strip (brand signature, carried from login) ---------- */
.route-strip-mini {
  position: relative;
  width: 100%;
  height: 14px;
  overflow: hidden;
}
.route-strip-mini svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.route-strip-mini path { fill: none; stroke: var(--border); stroke-width: 2; stroke-dasharray: 6 8; }
.route-strip-mini .route-dot-mini {
  position: absolute; top: 50%; left: 6%;
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 8px 2px rgba(200,255,77,0.55);
  transform: translateY(-50%);
  animation: rideMini 4.2s ease-in-out infinite;
}
@keyframes rideMini { 0% { left: 4%; } 50% { left: 92%; } 100% { left: 4%; } }

/* ---------- Pull-to-refresh ---------- */
.ptr-indicator {
  height: 0;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: height 0.2s ease;
}
.ptr-spinner {
  width: 22px; height: 22px;
  border: 2.5px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  transform: rotate(0deg);
}
.ptr-spinner.is-spinning { animation: spin 0.7s linear infinite; }

.scroll-area {
  flex: 1;
  padding: 16px 16px calc(32px + env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* ---------- Shared card / section styles ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 18px;
  box-shadow: 0 16px 40px -24px rgba(0,0,0,0.6);
}

.section-block { animation: fadeUp 0.35s ease both; }
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
  padding: 0 2px;
}
.section-head h2 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-dim);
}
.section-count {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-dim);
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 2px 9px;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ---------- Profile card ---------- */
.profile-card { padding: 16px 18px; }
.profile-top { display: flex; align-items: center; gap: 12px; }
.avatar {
  width: 52px; height: 52px;
  border-radius: 16px;
  overflow: hidden;
  flex-shrink: 0;
  background: var(--surface-raised);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.avatar-fallback {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 20px;
  color: var(--accent);
}
.profile-info { flex: 1; min-width: 0; }
.profile-info h2 {
  margin: 0 0 2px;
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 700;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.profile-info p {
  margin: 0;
  font-size: 12.5px;
  color: var(--text-dim);
  text-transform: capitalize;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* Online/offline toggle switch */
.online-toggle { position: relative; flex-shrink: 0; cursor: pointer; }
.online-toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.toggle-track {
  display: block;
  width: 50px; height: 30px;
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 3px;
  transition: background 0.2s ease, border-color 0.2s ease;
}
.toggle-thumb {
  display: block;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--text-dim);
  transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), background 0.2s ease;
}
.online-toggle input:checked + .toggle-track {
  background: var(--accent-bg);
  border-color: var(--accent-dim);
}
.online-toggle input:checked + .toggle-track .toggle-thumb {
  transform: translateX(20px);
  background: var(--accent);
  box-shadow: 0 0 10px 1px rgba(200,255,77,0.5);
}
.online-toggle input:focus-visible + .toggle-track { outline: 2px solid var(--accent); outline-offset: 2px; }
.online-toggle.is-pending { opacity: 0.6; pointer-events: none; }

.online-status-row {
  display: flex; align-items: center; gap: 7px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px dashed var(--border);
  font-size: 12.5px;
  color: var(--text-dim);
  font-weight: 600;
}
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); flex-shrink: 0; }
.status-dot.online { background: var(--accent); box-shadow: 0 0 8px 2px rgba(200,255,77,0.5); animation: pulseDot 1.8s ease-in-out infinite; }
.status-dot.offline { background: var(--text-dim); }
@keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

/* ---------- Stats row ---------- */
.stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  display: flex; flex-direction: column; gap: 6px;
}
.stat-label {
  font-size: 11px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 600;
}
.stat-value {
  font-family: var(--font-mono);
  font-size: 22px;
  font-weight: 500;
  color: var(--text);
}
.stat-value.accent { color: var(--accent); }

/* ---------- Skeleton shimmer (dark) ---------- */
@keyframes shimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
.sk {
  display: inline-block;
  background: linear-gradient(90deg, var(--surface-raised) 25%, #2c333d 50%, var(--surface-raised) 75%);
  background-size: 800px 100%;
  animation: shimmer 1.4s infinite linear;
  border-radius: 7px;
}
.sk-stat { width: 64px; height: 22px; }
.sk-line { height: 12px; border-radius: 6px; display: block; }
.sk-avatar { width: 52px; height: 52px; border-radius: 16px; }
.sk-order-card { height: 230px; border-radius: 20px; width: 100%; }
.sk-row { height: 64px; border-radius: var(--radius); width: 100%; margin-bottom: 10px; }
.sk-row:last-child { margin-bottom: 0; }

/* ---------- Active order card ---------- */
.order-card { padding: 0; overflow: hidden; }
.order-card-top {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
}
.order-status-pill {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 5px 10px;
  border-radius: 999px;
  background: var(--accent-bg);
  color: var(--accent);
  border: 1px solid rgba(200,255,77,0.3);
}
.order-status-pill.is-pending {
  background: transparent;
  color: var(--text-dim);
  border: 1px dashed var(--border);
}
.order-id { font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); }

.order-parties { padding: 16px; display: flex; flex-direction: column; }
.party { display: flex; flex-direction: column; gap: 2px; }
.party-label {
  font-size: 10.5px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--text-dim);
}
.party-name { font-family: var(--font-display); font-size: 15px; font-weight: 700; }
.party-address { font-size: 12.5px; color: var(--text-dim); line-height: 1.4; }

.route-connector {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 0 10px 3px;
  margin-left: 3px;
}
.route-connector .line {
  width: 0; height: 22px;
  border-left: 2px dashed var(--border);
}
.route-connector .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 6px 1px rgba(200,255,77,0.5);
}

.order-meta-row {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 0 16px 16px;
}
.meta-item {
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 12px;
  display: flex; flex-direction: column; gap: 4px;
}
.meta-label { font-size: 10.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
.meta-value { font-family: var(--font-mono); font-size: 15px; font-weight: 500; }
.meta-value.accent { color: var(--accent); }

.order-actions {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 0 16px 12px;
}
.btn-call {
  display: flex; align-items: center; justify-content: center; gap: 7px;
  padding: 11px 0;
  border-radius: 10px;
  background: var(--surface-raised);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 13px; font-weight: 600;
  cursor: pointer;
  transition: border-color 0.15s ease, transform 0.05s ease;
}
.btn-call:hover { border-color: #3a4250; }
.btn-call:active { transform: scale(0.97); }
.btn-call.is-disabled { opacity: 0.4; pointer-events: none; }
.btn-call svg { width: 15px; height: 15px; flex-shrink: 0; }

.order-actions-primary { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 10px; }
.btn-navigate {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 0;
  border-radius: 10px;
  background: transparent;
  border: 1px solid var(--accent-dim);
  color: var(--accent);
  font-size: 13.5px; font-weight: 700;
  cursor: pointer;
  transition: background 0.15s ease, transform 0.05s ease;
}
.btn-navigate:hover { background: var(--accent-bg); }
.btn-navigate:active { transform: scale(0.98); }
.btn-navigate svg { width: 16px; height: 16px; }

.btn-primary {
  width: 100%;
  padding: 14px 0;
  border: none;
  border-radius: 10px;
  background: var(--accent);
  color: #10130F;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 14.5px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: background 0.15s ease, transform 0.05s ease;
}
.btn-primary:hover { background: var(--accent-dim); }
.btn-primary:active { transform: scale(0.98); }
.btn-primary:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

.btn-inline-spinner {
  width: 15px; height: 15px;
  border: 2px solid rgba(16,19,15,0.3);
  border-top-color: #10130F;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Empty / error states ---------- */
.empty-state, .error-state {
  padding: 32px 20px;
  display: flex; flex-direction: column; align-items: center; text-align: center;
  gap: 6px;
}
.empty-icon {
  width: 52px; height: 52px;
  border-radius: 16px;
  background: var(--surface-raised);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 6px;
  color: var(--accent);
}
.empty-icon svg { width: 24px; height: 24px; }
.empty-icon.is-searching { position: relative; }
.empty-icon.is-searching::after {
  content: "";
  position: absolute; inset: -6px;
  border-radius: 20px;
  border: 1.5px solid var(--accent-dim);
  opacity: 0;
  animation: radarPulse 2.2s ease-out infinite;
}
@keyframes radarPulse {
  0% { opacity: 0.55; transform: scale(0.9); }
  100% { opacity: 0; transform: scale(1.35); }
}
.empty-state h3, .error-state h3 { margin: 0; font-family: var(--font-display); font-size: 15px; font-weight: 700; }
.empty-state p, .error-state p { margin: 0; font-size: 13px; color: var(--text-dim); max-width: 260px; line-height: 1.5; }
.empty-cta {
  margin-top: 10px;
  padding: 9px 18px;
  border-radius: 999px;
  background: var(--accent-bg);
  border: 1px solid rgba(200,255,77,0.35);
  color: var(--accent);
  font-size: 12.5px; font-weight: 700;
  cursor: pointer;
}
.empty-cta:active { transform: scale(0.96); }
.error-state .empty-icon { color: var(--error); }
.btn-retry {
  margin-top: 10px;
  padding: 9px 18px;
  border-radius: 999px;
  background: var(--error-bg);
  border: 1px solid rgba(255,107,94,0.35);
  color: var(--error);
  font-size: 12.5px; font-weight: 700;
  cursor: pointer;
}
.btn-retry:active { transform: scale(0.96); }

/* ---------- Assigned orders list ---------- */
.assigned-row {
  display: flex; align-items: center; gap: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 10px;
}
.assigned-row:last-child { margin-bottom: 0; }
.assigned-badge {
  width: 38px; height: 38px; border-radius: 11px; flex-shrink: 0;
  background: var(--accent-bg);
  color: var(--accent);
  display: flex; align-items: center; justify-content: center;
}
.assigned-badge svg { width: 18px; height: 18px; }
.assigned-info { flex: 1; min-width: 0; }
.assigned-name { font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.assigned-sub { font-size: 11.5px; color: var(--text-dim); font-family: var(--font-mono); }
.btn-accept {
  flex-shrink: 0;
  padding: 8px 14px;
  border-radius: 8px;
  border: none;
  background: var(--accent);
  color: #10130F;
  font-size: 12.5px; font-weight: 700;
  cursor: pointer;
}
.btn-accept:active { transform: scale(0.95); }
.btn-accept:disabled { opacity: 0.6; cursor: not-allowed; }

/* ---------- Quick actions ---------- */
.quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.qa-btn {
  display: flex; align-items: center; gap: 10px;
  padding: 13px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  cursor: pointer;
  transition: border-color 0.15s ease, transform 0.05s ease;
}
.qa-btn:hover { border-color: #3a4250; }
.qa-btn:active { transform: scale(0.97); }
.qa-icon {
  width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0;
  background: var(--surface-raised);
  color: var(--accent);
  display: flex; align-items: center; justify-content: center;
}
.qa-icon svg { width: 15px; height: 15px; }
.qa-label { font-size: 12.5px; font-weight: 600; }
.qa-btn.is-danger .qa-icon { color: var(--error); }

.earnings-detail {
  margin-top: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  animation: fadeUp 0.25s ease both;
}
.earnings-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px dashed var(--border);
  font-size: 13px;
}
.earnings-row:last-child { border-bottom: none; }
.earnings-row .label { color: var(--text-dim); font-weight: 600; }
.earnings-row .value { font-family: var(--font-mono); font-weight: 500; }
.support-note {
  margin-top: 10px;
  font-size: 12.5px;
  color: var(--text-dim);
  text-align: center;
  padding: 10px 12px;
  border: 1px dashed var(--border);
  border-radius: 10px;
  animation: fadeUp 0.25s ease both;
}

/* ---------- History ---------- */
.history-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.history-row:last-child { border-bottom: none; }
.history-icon {
  width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--surface-raised);
  color: var(--text-dim);
}
.history-icon svg { width: 16px; height: 16px; }
.history-icon.is-delivered { color: var(--accent); }
.history-icon.is-cancelled { color: var(--error); }
.history-info { flex: 1; min-width: 0; }
.history-name { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.history-date { font-size: 11.5px; color: var(--text-dim); margin-top: 1px; }
.history-amount { font-family: var(--font-mono); font-size: 13.5px; font-weight: 500; flex-shrink: 0; }
.history-amount.accent { color: var(--accent); }

/* ---------- Toast ---------- */
.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translate(-50%, 16px);
  max-width: calc(100% - 32px);
  background: var(--surface-raised);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 13px; font-weight: 600;
  padding: 12px 18px;
  border-radius: 12px;
  box-shadow: 0 16px 40px -12px rgba(0,0,0,0.6);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s ease;
  z-index: 90;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.is-error { border-color: rgba(255,107,94,0.4); color: var(--error); }

/* ---------- OTP verification modal ---------- */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(10, 12, 15, 0.72);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  animation: fadeIn 0.18s ease both;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.otp-modal {
  width: 100%;
  max-width: 340px;
  padding: 22px;
  animation: modalPop 0.22s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes modalPop {
  from { opacity: 0; transform: translateY(10px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.otp-modal-head { display: flex; align-items: center; justify-content: space-between; }
.otp-modal-head h3 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 700;
}
.otp-modal-close { width: 30px; height: 30px; }
.otp-modal-close svg { width: 14px; height: 14px; }
.otp-modal-sub {
  margin: 4px 0 18px;
  font-size: 13px;
  color: var(--text-dim);
}
.otp-input-row {
  display: flex; gap: 10px; justify-content: center;
  margin-bottom: 14px;
}
.otp-box {
  width: 52px; height: 58px;
  text-align: center;
  font-family: var(--font-mono);
  font-size: 22px;
  font-weight: 500;
  color: var(--text);
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-radius: 12px;
  transition: border-color 0.15s ease, background 0.15s ease;
}
.otp-box:focus {
  outline: none;
  border-color: var(--accent);
  background: var(--accent-bg);
}
.otp-box:disabled { opacity: 0.65; }
.otp-feedback {
  text-align: center;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 14px;
}
.otp-feedback.is-error { color: var(--error); }
.otp-feedback.is-success { color: var(--accent); }
.otp-modal-actions { display: flex; flex-direction: column; gap: 10px; }

@media (max-width: 380px) {
  .card, .profile-card, .order-card { border-radius: 16px; }
  .scroll-area { padding: 14px 12px calc(28px + env(safe-area-inset-bottom)); }
}

@media (prefers-reduced-motion: reduce) {
  .route-dot-mini, .status-dot.online, .empty-icon.is-searching::after, .sk { animation: none; }
}

            </span>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- OTP verification modal (opened from "Mark delivered" on the active order) -->
  <div class="modal-overlay is-hidden" id="otp-modal-overlay" aria-hidden="true">
    <div class="card otp-modal" id="otp-modal" role="dialog" aria-modal="true" aria-labelledby="otp-modal-title"></div>
  </div>

  <script>
(() => {
  "use strict";

  /* ══════════════════════════════════════════════════════════════
     CONFIG
     If the frontend is ever served from a different origin than the
     API, change this to the full API origin (e.g. "http://localhost:5000"),
     same convention as login.html.
  ══════════════════════════════════════════════════════════════ */
  const API_BASE = "https://eatswada.onrender.com";
  const LOGIN_PAGE = "login.html";

  const token = localStorage.getItem("riderToken");
  if (!token) {
    window.location.href = LOGIN_PAGE;
    return;
  }

  /* ══════════════════════════════════════════════════════════════
     FIELD MAPPING NOTE
     The Order schema wasn't available while building this file.
     normalizeOrder() below is the ONLY place that reads raw order
     fields for restaurant / customer / address / distance — it tries
     several common shapes and degrades gracefully ("—") if a field
     isn't present. riderEarning, riderStatus, _id and riderAssignedAt
     are confirmed field names straight from riderController.js.
     If your actual Order schema uses different field names for the
     rest, this is the one function to edit — nothing else needs to
     change.
  ══════════════════════════════════════════════════════════════ */
  function formatAddress(addr) {
    if (!addr) return "";
    if (typeof addr === "string") return addr;
    return [
      addr.tag,
      addr.house,
      addr.line1,
      addr.street,
      addr.area,
      addr.landmark ? `Near ${addr.landmark}` : "",
      addr.city,
      addr.pincode
    ].filter(Boolean).join(", ");
  }

  function normalizeOrder(raw) {
    if (!raw) return null;
    const restaurant = raw.restaurant && typeof raw.restaurant === "object" ? raw.restaurant : null;
    const customer = (raw.customer && typeof raw.customer === "object") ? raw.customer
                    : (raw.user && typeof raw.user === "object") ? raw.user : null;
    const dd = raw.deliveryDetails || {};

    return {
      id: raw._id,
      shortId: "#" + String(raw._id || "").slice(-6).toUpperCase(),
      riderStatus: raw.riderStatus || "assigned",
      restaurantName: raw.restaurantName || restaurant?.name || "Restaurant",
      restaurantAddress: formatAddress(raw.restaurantAddress || restaurant?.address || restaurant?.location?.address) || "—",
      restaurantPhone: raw.restaurantPhone || restaurant?.phone || restaurant?.contactNumber || "",
      customerName: raw.customerName || customer?.name || dd.name || "Customer",
      customerPhone: raw.customerPhone || customer?.phone || dd.phone || raw.contactNumber || "",
      address: formatAddress(raw.deliveryAddress || raw.address || raw.shippingAddress || dd.address) || "—",
      earnings: Number(raw.riderEarning || 0),
      distance: raw.distance ?? raw.deliveryDistance ?? raw.distanceKm ?? null,
      assignedAt: raw.riderAssignedAt || raw.createdAt,
      updatedAt: raw.updatedAt,
      status: raw.status,
      deliveryOtpVerified: !!raw.deliveryOtpVerified,
    };
  }

  /* ── Delivery status flow (mirrors RIDER_STATUS_FLOW in riderController.js) ── */
  const STATUS_LABELS = {
    assigned: "New assignment",
    accepted: "Accepted",
    reached_restaurant: "At restaurant",
    picked_up: "Picked up",
    out_for_delivery: "Out for delivery",
    otp_verified: "PIN verified",
    delivered: "Delivered",
  };
  const NEXT_ACTION = {
    assigned:            { next: "accepted",            label: "Accept order" },
    accepted:             { next: "reached_restaurant",  label: "Arrived at restaurant" },
    reached_restaurant:   { next: "picked_up",            label: "Mark picked up" },
    picked_up:             { next: "out_for_delivery",     label: "Start delivery" },
    out_for_delivery:      { next: "delivered",            label: "Mark delivered" },
    // otp_verified: the backend has confirmed the PIN but the rider hasn't
    // tapped "Mark delivered" yet (e.g. they left and came back). Route the
    // same "delivered" action here so the button still shows on reload —
    // openOtpModal() below sees this status and skips straight past PIN
    // entry to the already-verified state.
    otp_verified:          { next: "delivered",            label: "Mark delivered" },
  };
  const TOAST_ON_ADVANCE = {
    accepted: "Order accepted.",
    reached_restaurant: "Marked as arrived at the restaurant.",
    picked_up: "Marked as picked up.",
    out_for_delivery: "Delivery started.",
    delivered: "Delivered 🎉",
  };

  /* ══════════════════════════════════════════════════════════════
     API helpers
  ══════════════════════════════════════════════════════════════ */
  function authHeaders(extra) {
    return Object.assign({ Authorization: "Bearer " + localStorage.getItem("riderToken") }, extra || {});
  }

  async function handleResponse(res) {
    let data;
    try { data = await res.json(); }
    catch { throw new Error("Unexpected response from the server."); }

    if (res.status === 401) {
      localStorage.removeItem("riderToken");
      localStorage.removeItem("riderUser");
      window.location.href = LOGIN_PAGE;
      throw new Error("Session expired.");
    }
    if (!res.ok || data.success === false) {
      throw new Error(data.message || "Something went wrong. Please try again.");
    }
    return data;
  }

  async function apiGet(path) {
    try {
      const res = await fetch(API_BASE + path, { headers: authHeaders() });
      return await handleResponse(res);
    } catch (err) {
      throw new Error(err.message === "Failed to fetch"
        ? "Can't reach the server. Check your connection and try again."
        : err.message);
    }
  }

  async function apiPut(path, body) {
    try {
      const res = await fetch(API_BASE + path, {
        method: "PUT",
        headers: authHeaders({ "Content-Type": "application/json" }),
        body: JSON.stringify(body || {}),
      });
      return await handleResponse(res);
    } catch (err) {
      throw new Error(err.message === "Failed to fetch"
        ? "Can't reach the server. Check your connection and try again."
        : err.message);
    }
  }

  async function apiPost(path, body) {
    try {
      const res = await fetch(API_BASE + path, {
        method: "POST",
        headers: authHeaders({ "Content-Type": "application/json" }),
        body: JSON.stringify(body || {}),
      });
      return await handleResponse(res);
    } catch (err) {
      throw new Error(err.message === "Failed to fetch"
        ? "Can't reach the server. Check your connection and try again."
        : err.message);
    }
  }

  /* ══════════════════════════════════════════════════════════════
     Small utilities
  ══════════════════════════════════════════════════════════════ */
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function formatCurrency(n) {
    return "₹" + Number(n || 0).toLocaleString("en-IN");
  }

  function formatRelativeDate(dateStr) {
    if (!dateStr) return "";
    const d = new Date(dateStr);
    if (isNaN(d)) return "";
    const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    const yest = new Date(now); yest.setDate(now.getDate() - 1);
    const isYesterday = d.toDateString() === yest.toDateString();
    const time = d.toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit" });
    if (sameDay) return "Today, " + time;
    if (isYesterday) return "Yesterday, " + time;
    return d.toLocaleDateString("en-IN", { day: "numeric", month: "short" }) + ", " + time;
  }

  let toastTimer = null;
  function showToast(message, type) {
    const el = document.getElementById("toast");
    el.textContent = message;
    el.classList.toggle("is-error", type === "error");
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 3200);
  }

  const svgPhone = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>';
  const svgNavigate = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>';
  const svgClose = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';

  /* ══════════════════════════════════════════════════════════════
     Profile
  ══════════════════════════════════════════════════════════════ */
  let isOnline = null;

  async function loadProfile() {
    try {
      const res = await apiGet("/api/riders/profile");
      renderProfile(res.data);
    } catch (err) {
      document.getElementById("profile-card").innerHTML =
        '<div class="error-state" style="padding:16px 0;">' +
          '<p>' + escapeHtml(err.message) + '</p>' +
          '<button class="btn-retry" onclick="window.__nb_retryProfile()">Retry</button>' +
        '</div>';
    }
  }
  window.__nb_retryProfile = loadProfile;

  function renderProfile(rider) {
    isOnline = !!(rider.riderDetails && rider.riderDetails.isOnline);
    const vehicle = rider.riderDetails?.vehicleType || "Rider";
    const zone = rider.riderDetails?.deliveryZone || "Zone not set";
    const initial = (rider.name || "R").trim().charAt(0).toUpperCase();

    document.getElementById("profile-card").innerHTML = `
      <div class="profile-top">
        <div class="avatar">
          ${rider.avatar
            ? `<img src="${escapeHtml(rider.avatar)}" alt="${escapeHtml(rider.name || "Rider")}">`
            : `<span class="avatar-fallback">${escapeHtml(initial)}</span>`}
        </div>
        <div class="profile-info">
          <h2>${escapeHtml(rider.name || "Rider")}</h2>
          <p>${escapeHtml(vehicle)} • ${escapeHtml(zone)}</p>
        </div>
        <label class="online-toggle" id="online-toggle">
          <input type="checkbox" id="online-checkbox" ${isOnline ? "checked" : ""}>
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
        </label>
      </div>
      <div class="online-status-row">
        <span class="status-dot ${isOnline ? "online" : "offline"}" id="status-dot"></span>
        <span id="status-label">${isOnline ? "You're online — visible for new orders" : "You're offline"}</span>
      </div>
    `;

    document.getElementById("online-checkbox").addEventListener("change", onToggleOnline);
  }

  async function onToggleOnline(e) {
    const desired = e.target.checked;
    const wrap = document.getElementById("online-toggle");
    wrap.classList.add("is-pending");
    try {
      const res = await apiPut("/api/riders/status", { isOnline: desired });
      isOnline = !!res.data.isOnline;
      updateStatusRow();
      showToast(isOnline ? "You're online." : "You're offline.");
      // If the active-order slot is currently showing the empty state,
      // refresh its copy to reflect the new online/offline status.
      if (currentActiveOrder === null) renderActiveOrder(null);
    } catch (err) {
      e.target.checked = !desired;
      showToast(err.message, "error");
    } finally {
      wrap.classList.remove("is-pending");
    }
  }

  function updateStatusRow() {
    const dot = document.getElementById("status-dot");
    const label = document.getElementById("status-label");
    if (!dot || !label) return;
    dot.classList.toggle("online", isOnline);
    dot.classList.toggle("offline", !isOnline);
    label.textContent = isOnline ? "You're online — visible for new orders" : "You're offline";
  }

  /* ══════════════════════════════════════════════════════════════
     Earnings / stats
  ══════════════════════════════════════════════════════════════ */
  let earningsSummary = null;

  async function loadEarnings() {
    try {
      const res = await apiGet("/api/riders/earnings");
      earningsSummary = res.data;
      document.getElementById("stat-earnings").textContent = formatCurrency(res.data.today.earnings);
      document.getElementById("stat-deliveries").textContent = res.data.today.deliveries;
      document.getElementById("stat-earnings").classList.add("accent");
      renderEarningsDetail();
    } catch (err) {
      document.getElementById("stat-earnings").textContent = "—";
      document.getElementById("stat-deliveries").textContent = "—";
    }
  }

  function renderEarningsDetail() {
    const el = document.getElementById("earnings-detail");
    if (!earningsSummary) return;
    const row = (label, s) =>
      `<div class="earnings-row"><span class="label">${label}</span><span class="value">${formatCurrency(s.earnings)} · ${s.deliveries} del.</span></div>`;
    el.innerHTML =
      row("Today", earningsSummary.today) +
      row("This week", earningsSummary.thisWeek) +
      row("This month", earningsSummary.thisMonth) +
      row("All time", earningsSummary.allTime);
  }

  /* ══════════════════════════════════════════════════════════════
     Active order
  ══════════════════════════════════════════════════════════════ */
  let currentActiveOrder = null;

  async function loadActiveOrder() {
    try {
      const res = await apiGet("/api/riders/orders/active");
      currentActiveOrder = normalizeOrder(res.data);
      renderActiveOrder(currentActiveOrder);
    } catch (err) {
      document.getElementById("active-order-wrap").innerHTML = `
        <div class="card error-state">
          <div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>
          <h3>Couldn't load your active order</h3>
          <p>${escapeHtml(err.message)}</p>
          <button class="btn-retry" onclick="window.__nb_retryActive()">Retry</button>
        </div>`;
    }
  }
  window.__nb_retryActive = loadActiveOrder;

  function renderActiveOrder(order) {
    const wrap = document.getElementById("active-order-wrap");

    if (!order) {
      const online = isOnline === true;
      wrap.innerHTML = `
        <div class="card empty-state">
          <div class="empty-icon ${online ? "is-searching" : ""}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v10M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2v-4"/></svg>
          </div>
          <h3>${online ? "Ready to roll" : "You're offline"}</h3>
          <p>${online
            ? "You're online — we'll drop your next delivery here the moment it's ready."
            : "Go online to start receiving delivery requests."}</p>
          ${online ? "" : '<button class="empty-cta" id="go-online-cta">Go online</button>'}
        </div>`;
      const cta = document.getElementById("go-online-cta");
      if (cta) cta.addEventListener("click", () => {
        const cb = document.getElementById("online-checkbox");
        if (cb) { cb.checked = true; cb.dispatchEvent(new Event("change")); }
      });
      return;
    }

    const isPending = order.riderStatus === "assigned";
    const statusLabel = STATUS_LABELS[order.riderStatus] || order.riderStatus;
    const action = NEXT_ACTION[order.riderStatus];

    const navTarget = (order.riderStatus === "picked_up" || order.riderStatus === "out_for_delivery")
      ? order.address : order.restaurantAddress;
    const navUrl = "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(navTarget);

    wrap.innerHTML = `
      <div class="card order-card">
        <div class="order-card-top">
          <span class="order-status-pill ${isPending ? "is-pending" : ""}">${escapeHtml(statusLabel)}</span>
          <span class="order-id">${order.shortId}</span>
        </div>

        <div class="order-parties">
          <div class="party">
            <span class="party-label">Restaurant</span>
            <span class="party-name">${escapeHtml(order.restaurantName)}</span>
            <span class="party-address">${escapeHtml(order.restaurantAddress)}</span>
          </div>
          <div class="route-connector"><span class="line"></span><span class="dot"></span></div>
          <div class="party">
            <span class="party-label">Customer</span>
            <span class="party-name">${escapeHtml(order.customerName)}</span>
            <span class="party-address">${escapeHtml(order.address)}</span>
          </div>
        </div>

        <div class="order-meta-row">
          <div class="meta-item">
            <span class="meta-label">Earnings</span>
            <span class="meta-value accent">${formatCurrency(order.earnings)}</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Distance</span>
            <span class="meta-value">${order.distance != null ? order.distance + " km" : "—"}</span>
          </div>
        </div>

        <div class="order-actions">
          <a class="btn-call ${order.restaurantPhone ? "" : "is-disabled"}" href="tel:${escapeHtml(order.restaurantPhone)}">${svgPhone} Call restaurant</a>
          <a class="btn-call ${order.customerPhone ? "" : "is-disabled"}" href="tel:${escapeHtml(order.customerPhone)}">${svgPhone} Call customer</a>
        </div>

        <div class="order-actions-primary">
          <a class="btn-navigate" href="${navUrl}" target="_blank" rel="noopener noreferrer">${svgNavigate} Navigate</a>
          ${action ? `<button class="btn-primary" id="advance-btn">${escapeHtml(action.label)}</button>` : ""}
        </div>
      </div>`;

    const advanceBtn = document.getElementById("advance-btn");
    if (advanceBtn && action) {
      advanceBtn.addEventListener("click", () => {
        if (action.next === "delivered") {
          // "Mark delivered" always goes through PIN verification first.
          // If the order already came back as otp_verified (e.g. the rider
          // verified the PIN, then backgrounded the app before tapping
          // through), skip straight to the verified state.
          openOtpModal(order.id, order.riderStatus === "otp_verified" || order.deliveryOtpVerified);
        } else {
          advanceOrderStatus(order.id, action.next, advanceBtn);
        }
      });
    }
  }

  async function advanceOrderStatus(orderId, nextStatus, btnEl) {
    const originalLabel = btnEl.innerHTML;
    btnEl.disabled = true;
    btnEl.innerHTML = '<span class="btn-inline-spinner"></span>';
    try {
      await apiPut(`/api/riders/orders/${orderId}/status`, { status: nextStatus });
      showToast(TOAST_ON_ADVANCE[nextStatus] || "Order updated.");
      await Promise.all([loadActiveOrder(), loadEarnings(), loadAssignedOrders(), loadHistory()]);
    } catch (err) {
      showToast(err.message, "error");
      btnEl.disabled = false;
      btnEl.innerHTML = originalLabel;
    }
  }

  /* ══════════════════════════════════════════════════════════════
     OTP delivery verification modal
     Flow: rider taps "Mark delivered" on an out_for_delivery order →
     modal opens asking for the customer's 4-digit PIN → POST verify-otp →
     on success the modal reveals its own "Mark Delivered" button, which
     PUTs status=delivered through the same endpoint advanceOrderStatus()
     already uses.

     ENDPOINT NOTE: every other endpoint in this file lives under
     /api/riders/... (plural), so verify-otp is called the same way below.
     If the actual backend route is singular (/api/rider/...), this is the
     one line to change.
  ══════════════════════════════════════════════════════════════ */
  let otpModalOrderId = null;
  let otpVerified = false;

  function openOtpModal(orderId, alreadyVerified) {
    otpModalOrderId = orderId;
    otpVerified = !!alreadyVerified;
    renderOtpModal();
    document.getElementById("otp-modal-overlay").classList.remove("is-hidden");
  }

  function closeOtpModal() {
    document.getElementById("otp-modal-overlay").classList.add("is-hidden");
    document.getElementById("otp-modal").innerHTML = "";
    otpModalOrderId = null;
    otpVerified = false;
  }

  function renderOtpModal() {
    const modal = document.getElementById("otp-modal");
    modal.innerHTML = `
      <div class="otp-modal-head">
        <h3 id="otp-modal-title">Verify Delivery</h3>
        <button class="icon-btn otp-modal-close" id="otp-modal-close" type="button" aria-label="Close">${svgClose}</button>
      </div>
      <p class="otp-modal-sub">Enter the customer's 4-digit PIN</p>
      <div class="otp-input-row ${otpVerified ? "is-hidden" : ""}" id="otp-input-row">
        <input class="otp-box" id="otp-box-0" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="PIN digit 1">
        <input class="otp-box" id="otp-box-1" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="PIN digit 2">
        <input class="otp-box" id="otp-box-2" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="PIN digit 3">
        <input class="otp-box" id="otp-box-3" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="PIN digit 4">
      </div>
      <div class="otp-feedback ${otpVerified ? "is-success" : "is-hidden"}" id="otp-feedback">${otpVerified ? "✅ PIN Verified" : ""}</div>
      <div class="otp-modal-actions">
        <button class="btn-primary ${otpVerified ? "is-hidden" : ""}" id="otp-verify-btn" type="button" disabled>Verify OTP</button>
        <button class="btn-primary ${otpVerified ? "" : "is-hidden"}" id="otp-mark-delivered-btn" type="button" ${otpVerified ? "" : "disabled"}>Mark Delivered</button>
      </div>
    `;
    wireOtpModalEvents();
  }

  function wireOtpModalEvents() {
    const boxes = [0, 1, 2, 3].map((i) => document.getElementById(`otp-box-${i}`));

    boxes.forEach((box, i) => {
      if (!box) return;
      box.addEventListener("input", (e) => {
        e.target.value = e.target.value.replace(/[^0-9]/g, "").slice(0, 1);
        if (e.target.value && boxes[i + 1]) boxes[i + 1].focus();
        updateVerifyBtnState();
      });
      box.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && !box.value && boxes[i - 1]) boxes[i - 1].focus();
        if (e.key === "Enter") {
          const btn = document.getElementById("otp-verify-btn");
          if (btn && !btn.disabled) submitOtp();
        }
      });
      box.addEventListener("paste", (e) => {
        const text = (e.clipboardData || window.clipboardData).getData("text").replace(/[^0-9]/g, "");
        if (text.length >= 4) {
          e.preventDefault();
          text.slice(0, 4).split("").forEach((d, idx) => { if (boxes[idx]) boxes[idx].value = d; });
          boxes[3].focus();
          updateVerifyBtnState();
        }
      });
    });

    if (!otpVerified && boxes[0]) boxes[0].focus();

    const verifyBtn = document.getElementById("otp-verify-btn");
    if (verifyBtn) verifyBtn.addEventListener("click", submitOtp);

    const markBtn = document.getElementById("otp-mark-delivered-btn");
    if (markBtn) markBtn.addEventListener("click", () => confirmDeliveryAfterOtp(markBtn));

    const closeBtn = document.getElementById("otp-modal-close");
    if (closeBtn) closeBtn.addEventListener("click", closeOtpModal);

    updateVerifyBtnState();
  }

  function updateVerifyBtnState() {
    if (otpVerified) return;
    const boxes = [0, 1, 2, 3].map((i) => document.getElementById(`otp-box-${i}`));
    const verifyBtn = document.getElementById("otp-verify-btn");
    if (!verifyBtn) return;
    verifyBtn.disabled = !boxes.every((b) => b && b.value.length === 1);
  }

  async function submitOtp() {
    if (otpVerified || !otpModalOrderId) return;
    const boxes = [0, 1, 2, 3].map((i) => document.getElementById(`otp-box-${i}`));
    const otp = boxes.map((b) => b.value).join("");
    if (otp.length !== 4) return;

    const verifyBtn = document.getElementById("otp-verify-btn");
    const feedback = document.getElementById("otp-feedback");
    const originalLabel = verifyBtn.innerHTML;
    verifyBtn.disabled = true;
    verifyBtn.innerHTML = '<span class="btn-inline-spinner"></span>';
    feedback.classList.add("is-hidden");
    feedback.classList.remove("is-error", "is-success");

    try {
      await apiPost(`/api/riders/orders/${otpModalOrderId}/verify-otp`, { otp });
      otpVerified = true;
      feedback.textContent = "✅ PIN Verified";
      feedback.classList.remove("is-hidden", "is-error");
      feedback.classList.add("is-success");
      document.getElementById("otp-input-row").classList.add("is-hidden");
      verifyBtn.classList.add("is-hidden");
      const markBtn = document.getElementById("otp-mark-delivered-btn");
      markBtn.classList.remove("is-hidden");
      markBtn.disabled = false;
    } catch (err) {
      feedback.textContent = "❌ Incorrect PIN";
      feedback.classList.remove("is-hidden", "is-success");
      feedback.classList.add("is-error");
      boxes.forEach((b) => { if (b) b.value = ""; });
      if (boxes[0]) boxes[0].focus();
      verifyBtn.innerHTML = originalLabel;
      verifyBtn.disabled = true;
    }
  }

  async function confirmDeliveryAfterOtp(btnEl) {
    const orderId = otpModalOrderId;
    if (!orderId) return;
    const originalLabel = btnEl.innerHTML;
    btnEl.disabled = true;
    btnEl.innerHTML = '<span class="btn-inline-spinner"></span>';
    try {
      await apiPut(`/api/riders/orders/${orderId}/status`, { status: "delivered" });
      showToast(TOAST_ON_ADVANCE.delivered);
      closeOtpModal();
      await Promise.all([loadActiveOrder(), loadEarnings(), loadAssignedOrders(), loadHistory()]);
    } catch (err) {
      showToast(err.message, "error");
      btnEl.disabled = false;
      btnEl.innerHTML = originalLabel;
    }
  }

  /* ══════════════════════════════════════════════════════════════
     Assigned orders (queue of freshly-assigned orders awaiting accept —
     distinct from the single "active" order above, which can be in any
     stage of the delivery flow)
  ══════════════════════════════════════════════════════════════ */
  async function loadAssignedOrders() {
    try {
      const res = await apiGet("/api/riders/orders?status=assigned&limit=10");
      const orders = (res.data.orders || [])
        .map(normalizeOrder)
        .filter((o) => !currentActiveOrder || o.id !== currentActiveOrder.id);
      renderAssignedList(orders);
    } catch (err) {
      document.getElementById("assigned-list").innerHTML = `
        <div class="card error-state" style="padding:20px;">
          <p>${escapeHtml(err.message)}</p>
          <button class="btn-retry" onclick="window.__nb_retryAssigned()">Retry</button>
        </div>`;
    }
  }
  window.__nb_retryAssigned = loadAssignedOrders;

  function renderAssignedList(orders) {
    const list = document.getElementById("assigned-list");
    const count = document.getElementById("assigned-count");

    if (!orders.length) {
      count.classList.add("is-hidden");
      list.innerHTML = `
        <div class="card empty-state" style="padding:22px 18px;">
          <div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></div>
          <h3>No orders waiting</h3>
          <p>New assignments will show up here.</p>
        </div>`;
      return;
    }

    count.textContent = orders.length;
    count.classList.remove("is-hidden");

    list.innerHTML = orders.map((o) => `
      <div class="assigned-row" data-id="${o.id}">
        <span class="assigned-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.3 2.3c-.6.6-.2 1.7.7 1.7H17m-8-1a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm8 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg></span>
        <div class="assigned-info">
          <div class="assigned-name">${escapeHtml(o.restaurantName)}</div>
          <div class="assigned-sub">${o.shortId} · ${formatCurrency(o.earnings)}</div>
        </div>
        <button class="btn-accept" data-id="${o.id}">Accept</button>
      </div>
    `).join("");

    list.querySelectorAll(".btn-accept").forEach((btn) => {
      btn.addEventListener("click", () => acceptAssignedOrder(btn.dataset.id, btn));
    });
  }

  async function acceptAssignedOrder(orderId, btnEl) {
    btnEl.disabled = true;
    btnEl.textContent = "Accepting…";
    try {
      await apiPut(`/api/riders/orders/${orderId}/status`, { status: "accepted" });
      showToast("Order accepted.");
      await Promise.all([loadActiveOrder(), loadAssignedOrders()]);
    } catch (err) {
      showToast(err.message, "error");
      btnEl.disabled = false;
      btnEl.textContent = "Accept";
    }
  }

  /* ══════════════════════════════════════════════════════════════
     History preview
  ══════════════════════════════════════════════════════════════ */
  async function loadHistory() {
    try {
      const res = await apiGet("/api/riders/orders/history?limit=5");
      renderHistory((res.data.orders || []).map(normalizeOrder));
    } catch (err) {
      document.getElementById("history-list").innerHTML = `
        <div class="error-state" style="padding:16px 0;">
          <p>${escapeHtml(err.message)}</p>
          <button class="btn-retry" onclick="window.__nb_retryHistory()">Retry</button>
        </div>`;
    }
  }
  window.__nb_retryHistory = loadHistory;

  function renderHistory(orders) {
    const list = document.getElementById("history-list");
    if (!orders.length) {
      list.innerHTML = `
        <div class="empty-state" style="padding:22px 4px;">
          <div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
          <h3>No deliveries yet</h3>
          <p>Your completed deliveries will show up here.</p>
        </div>`;
      return;
    }

    list.innerHTML = orders.map((o) => {
      const cancelled = o.status === "cancelled";
      const icon = cancelled
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
      return `
        <div class="history-row">
          <span class="history-icon ${cancelled ? "is-cancelled" : "is-delivered"}">${icon}</span>
          <div class="history-info">
            <div class="history-name">${escapeHtml(o.restaurantName)}</div>
            <div class="history-date">${formatRelativeDate(o.updatedAt)}</div>
          </div>
          <span class="history-amount ${cancelled ? "" : "accent"}">${cancelled ? "—" : formatCurrency(o.earnings)}</span>
        </div>`;
    }).join("");
  }

  /* ══════════════════════════════════════════════════════════════
     Quick actions
  ══════════════════════════════════════════════════════════════ */
  document.getElementById("qa-refresh").addEventListener("click", (e) => {
    const icon = e.currentTarget.querySelector(".qa-icon");
    icon.style.animation = "spin 0.6s linear";
    refreshAll().finally(() => { icon.style.animation = ""; });
  });

  document.getElementById("qa-earnings").addEventListener("click", () => {
    document.getElementById("earnings-detail").classList.toggle("is-hidden");
    document.getElementById("support-note").classList.add("is-hidden");
  });

  document.getElementById("qa-support").addEventListener("click", () => {
    document.getElementById("support-note").classList.toggle("is-hidden");
    document.getElementById("earnings-detail").classList.add("is-hidden");
  });

  document.getElementById("qa-logout").addEventListener("click", doLogout);
  document.getElementById("logout-btn").addEventListener("click", doLogout);

  function doLogout() {
    if (!confirm("Log out of Nearbite Rider?")) return;
    localStorage.removeItem("riderToken");
    localStorage.removeItem("riderUser");
    window.location.href = LOGIN_PAGE;
  }

  /* ══════════════════════════════════════════════════════════════
     Load orchestration
  ══════════════════════════════════════════════════════════════ */
  async function refreshAll() {
    await loadProfile(); // sets `isOnline` before active-order renders its empty state
    await Promise.all([loadEarnings(), loadActiveOrder(), loadAssignedOrders(), loadHistory()]);
  }

  /* ══════════════════════════════════════════════════════════════
     Pull-to-refresh (vanilla touch tracking)
  ══════════════════════════════════════════════════════════════ */
  function setupPullToRefresh() {
    const scrollArea = document.getElementById("scroll-area");
    const indicator = document.getElementById("ptr-indicator");
    const spinner = document.getElementById("ptr-spinner");
    const THRESHOLD = 56;
    const MAX_PULL = 84;
    const HOLD_HEIGHT = 52;

    let startY = null;
    let pulling = false;
    let refreshing = false;

    scrollArea.addEventListener("touchstart", (e) => {
      if (refreshing || window.scrollY > 2) { startY = null; return; }
      startY = e.touches[0].clientY;
      pulling = true;
      indicator.style.transition = "none";
    }, { passive: true });

    scrollArea.addEventListener("touchmove", (e) => {
      if (!pulling || startY === null || refreshing) return;
      const delta = e.touches[0].clientY - startY;
      if (delta <= 0) return;
      if (window.scrollY > 2) { pulling = false; return; }

      const pull = Math.min(delta * 0.45, MAX_PULL);
      indicator.style.height = pull + "px";
      spinner.style.transform = `rotate(${pull * 3.6}deg)`;
      spinner.classList.toggle("is-spinning", pull >= THRESHOLD);
      if (e.cancelable) e.preventDefault();
    }, { passive: false });

    scrollArea.addEventListener("touchend", () => {
      if (!pulling || startY === null) { startY = null; return; }
      pulling = false;
      indicator.style.transition = "height 0.25s cubic-bezier(0.25,0.46,0.45,0.94)";

      const wasArmed = spinner.classList.contains("is-spinning");
      startY = null;

      if (wasArmed && !refreshing) {
        refreshing = true;
        indicator.style.height = HOLD_HEIGHT + "px";
        refreshAll().finally(() => {
          refreshing = false;
          spinner.classList.remove("is-spinning");
          indicator.style.height = "0px";
        });
      } else {
        indicator.style.height = "0px";
      }
    }, { passive: true });
  }

  /* ══════════════════════════════════════════════════════════════
     Init
  ══════════════════════════════════════════════════════════════ */
  document.getElementById("otp-modal-overlay").addEventListener("click", (e) => {
    if (e.target.id === "otp-modal-overlay") closeOtpModal();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    const overlay = document.getElementById("otp-modal-overlay");
    if (overlay && !overlay.classList.contains("is-hidden")) closeOtpModal();
  });

  refreshAll();
  setupPullToRefresh();
})();
  </script>
