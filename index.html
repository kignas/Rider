<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rider App – EatSwada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --brand: #10b981; /* Green brand for riders */
      --bg-dark: #0f1115;
      --bg-panel: #1a1d24;
      --bg-card: #23272f;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      padding-bottom: 80px;
      -webkit-tap-highlight-color: transparent;
    }

    .tap { cursor: pointer; transition: transform 0.1s ease; }
    .tap:active { transform: scale(0.96); }

    /* ── Header ── */
    .top-bar {
      position: sticky; top: 0; z-index: 50;
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(26, 29, 36, 0.9); backdrop-filter: blur(10px);
      padding: 16px 20px; border-bottom: 1px solid var(--border);
    }
    .brand-wrap { display: flex; align-items: center; gap: 10px; }
    .brand-title { font-size: 18px; font-weight: 900; color: #fff; }
    .brand-badge { background: rgba(16, 185, 129, 0.15); color: var(--brand); padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 800; text-transform: uppercase; border: 1px solid rgba(16, 185, 129, 0.3); }
    .btn-refresh { background: transparent; color: var(--brand); border: none; font-size: 20px; padding: 4px; }

    /* ── Main Container ── */
    .container { padding: 20px; }
    .section-title { font-size: 14px; font-weight: 900; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; display: flex; justify-content: space-between; }
    
    /* ── Delivery Card ── */
    .delivery-card {
      background: var(--bg-card); border-radius: 16px; padding: 16px;
      border: 1px solid var(--border); border-left: 5px solid var(--brand);
      margin-bottom: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }
    
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; border-bottom: 1px dashed var(--border); padding-bottom: 12px; }
    .order-id { font-size: 16px; font-weight: 900; color: #fff; }
    .pay-badge { font-size: 11px; padding: 4px 8px; border-radius: 6px; font-weight: 800; text-transform: uppercase; margin-top: 6px; display: inline-block; }
    .pay-cod { background: rgba(245,158,11,0.15); color: #fbbf24; border: 1px solid rgba(245,158,11,0.3); }
    .pay-paid { background: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
    .total-amt { font-size: 20px; font-weight: 900; color: #fff; }

    .customer-info { margin-bottom: 16px; }
    .cust-name { font-size: 18px; font-weight: 800; color: #fff; margin-bottom: 8px; }
    .action-row { display: flex; gap: 12px; margin-bottom: 12px; }
    .btn-action-small { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px; border-radius: 10px; font-size: 13px; font-weight: 800; text-decoration: none; border: none; }
    .btn-call { background: rgba(56, 189, 248, 0.1); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
    .btn-map { background: rgba(252, 128, 25, 0.1); color: #FC8019; border: 1px solid rgba(252, 128, 25, 0.3); }
    
    .cust-address { font-size: 14px; color: var(--text-sub); line-height: 1.5; background: #1a1d24; padding: 12px; border-radius: 8px; border: 1px solid var(--border); }

    /* ── OTP Verification Section ── */
    .pin-section { background: rgba(16, 185, 129, 0.05); border: 1.5px dashed rgba(16, 185, 129, 0.4); padding: 16px; border-radius: 12px; margin-top: 16px; text-align: center; }
    .pin-label { font-size: 12px; font-weight: 800; color: var(--brand); text-transform: uppercase; margin-bottom: 12px; }
    .pin-input-group { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; }
    .pin-box { width: 50px; height: 60px; background: #111; border: 2px solid var(--border); border-radius: 10px; font-size: 24px; font-weight: 900; color: #fff; text-align: center; font-family: 'Plus Jakarta Sans', sans-serif; }
    .pin-box:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.2); }
    
    .btn-deliver { width: 100%; background: var(--brand); color: #fff; border: none; padding: 16px; border-radius: 12px; font-size: 15px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 16px rgba(16,185,129,0.3); }
    .btn-deliver:disabled { background: var(--border); color: #64748b; box-shadow: none; cursor: not-allowed; }

    /* ── Empty State ── */
    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-sub); }
    .empty-state i { font-size: 48px; opacity: 0.2; margin-bottom: 16px; }
    .empty-state h3 { font-size: 18px; color: #fff; margin-bottom: 8px; }

  </style>
</head>
<body>

  <div class="top-bar">
    <div class="brand-wrap">
      <div class="brand-title">EatSwada</div>
      <div class="brand-badge">Rider</div>
    </div>
    <button class="btn-refresh tap" onclick="fetchDeliveries()"><i class="fa-solid fa-rotate"></i></button>
  </div>

  <div class="container">
    <div class="section-title">
      <span>Active Deliveries</span>
      <span id="delivery-count" style="color:var(--brand);">0</span>
    </div>

    <div id="delivery-list">
      </div>
  </div>

  <script>
    // 🧠 The exact same Math Hack to verify the PIN!
    function generateOTP(orderId) {
       let hash = parseInt(orderId.slice(-5), 16).toString();
       return hash.slice(-4).padStart(4, '0');
    }

    async function fetchDeliveries() {
      const token = localStorage.getItem('token') || localStorage.getItem('nearbite_token'); 
      if (!token) return alert("Rider must be logged in!");

      try {
        const response = await fetch('https://eatswada.onrender.com/api/orders/all', {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        const result = await response.json();
        if (response.ok && result.success) {
          // A rider only cares about orders that are explicitly "out_for_delivery"
          const activeDeliveries = result.data.filter(o => o.status === 'out_for_delivery');
          renderDeliveries(activeDeliveries);
        }
      } catch (error) {
        console.error("Fetch Error:", error);
      }
    }

    function renderDeliveries(orders) {
      const list = document.getElementById('delivery-list');
      document.getElementById('delivery-count').innerText = orders.length;

      if (orders.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-mug-hot"></i>
            <h3>No Active Deliveries</h3>
            <p>Wait for the kitchen to dispatch an order.</p>
          </div>
        `;
        return;
      }

      list.innerHTML = orders.map(order => {
        const name = (order.user && order.user.name) ? order.user.name : "Guest Customer";
        const phone = (order.user && order.user.phone) ? order.user.phone : "0000000000";
        
        let addressStr = "Address not provided";
        let mapLink = "#";
        if (order.deliveryAddress) {
          const addr = order.deliveryAddress;
          addressStr = [addr.house, addr.area, addr.landmark, addr.city].filter(Boolean).join(', ');
          // Create a Google Maps search link based on the area/city
          mapLink = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addressStr)}`;
        }

        const isPaid = order.paymentStatus === 'paid';
        const payBadge = isPaid 
          ? `<div class="pay-badge pay-paid">Paid Online - Do Not Collect Cash</div>` 
          : `<div class="pay-badge pay-cod">Collect Cash: ₹${order.total}</div>`;

        return `
          <div class="delivery-card" id="card-${order._id}">
            <div class="card-header">
              <div>
                <div class="order-id">${order.orderNumber || 'ORD-' + String(order._id).slice(-5).toUpperCase()}</div>
                ${payBadge}
              </div>
              <div class="total-amt">₹${order.total}</div>
            </div>
            
            <div class="customer-info">
              <div class="cust-name">${name}</div>
              <div class="action-row">
                <a href="tel:${phone}" class="btn-action-small btn-call tap"><i class="fa-solid fa-phone"></i> Call</a>
                <a href="${mapLink}" target="_blank" class="btn-action-small btn-map tap"><i class="fa-solid fa-location-arrow"></i> Map</a>
              </div>
              <div class="cust-address"><i class="fa-solid fa-location-dot" style="color:var(--text-sub); margin-right:6px;"></i> ${addressStr}</div>
            </div>

            <div class="pin-section">
              <div class="pin-label">Ask Customer for 4-Digit PIN</div>
              <div class="pin-input-group" id="group-${order._id}">
                <input type="tel" maxlength="1" class="pin-box" onkeyup="moveToNext(this, event)">
                <input type="tel" maxlength="1" class="pin-box" onkeyup="moveToNext(this, event)">
                <input type="tel" maxlength="1" class="pin-box" onkeyup="moveToNext(this, event)">
                <input type="tel" maxlength="1" class="pin-box" onkeyup="verifyAndDeliver('${order._id}', this)">
              </div>
              <button class="btn-deliver tap" id="btn-${order._id}" disabled onclick="completeDelivery('${order._id}')">
                <i class="fa-solid fa-check-double"></i> Mark Delivered
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // ── Smooth OTP Box Typing ──
    function moveToNext(current, event) {
      if (event.key === 'Backspace') {
         if (current.previousElementSibling) current.previousElementSibling.focus();
      } else if (current.value.length === 1) {
         if (current.nextElementSibling) current.nextElementSibling.focus();
      }
    }

    // ── Verify the PIN against the Math Hack ──
    function verifyAndDeliver(orderId, lastInput) {
      // Collect the 4 digits
      const group = document.getElementById(`group-${orderId}`);
      const inputs = group.querySelectorAll('input');
      const typedPIN = Array.from(inputs).map(i => i.value).join('');

      const expectedPIN = generateOTP(orderId);
      const btn = document.getElementById(`btn-${orderId}`);

      if (typedPIN.length === 4) {
         lastInput.blur();
         if (typedPIN === expectedPIN) {
            // Success! Unlock the green button
            inputs.forEach(i => i.style.borderColor = '#10b981');
            btn.disabled = false;
         } else {
            // Failed. Shake and reset
            inputs.forEach(i => { i.style.borderColor = '#ef4444'; i.value = ''; });
            inputs[0].focus();
            btn.disabled = true;
            alert("Incorrect PIN. Please ask the customer again.");
         }
      }
    }

    // ── Execute the API Call to finalize delivery ──
    async function completeDelivery(orderId) {
      const btn = document.getElementById(`btn-${orderId}`);
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Updating...';
      const token = localStorage.getItem('token') || localStorage.getItem('nearbite_token'); 

      try {
        const response = await fetch(`https://eatswada.onrender.com/api/orders/${orderId}/status`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ status: 'delivered' })
        });

        if (response.ok) {
          document.getElementById(`card-${orderId}`).style.display = 'none';
          fetchDeliveries(); // Refresh the board
        }
      } catch (err) {
        alert("Network error. Could not update order.");
        btn.innerHTML = '<i class="fa-solid fa-check-double"></i> Mark Delivered';
      }
    }

    // Run on load
    document.addEventListener('DOMContentLoaded', () => {
      fetchDeliveries();
      setInterval(fetchDeliveries, 15000); // Check for new dispatched orders every 15s
    });
  </script>
</body>
</html>
