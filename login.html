<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="icon.png">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#690D27">
<title>Eatswada Rider — Log In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap" rel="stylesheet">
<style>
:root{--brand:#690D27;--brand-dark:#4C0A1C;--ink:#1F1A17;--soft:#6B6259;--page:#FFFBF2;--line:#EFE7D4;--danger:#C8283A;--danger-bg:#FDECEE;--font:'Manrope',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{position:relative;min-height:100vh;min-height:100dvh;display:flex;justify-content:center;padding:0 16px;font-family:var(--font);color:var(--ink);background:var(--page);-webkit-font-smoothing:antialiased}
body::before{content:"";position:absolute;inset:0 0 auto;height:320px;border-radius:0 0 32px 32px;background:linear-gradient(160deg,#4C0A1C 0%,#2A0511 100%)}
body::after{content:"";position:absolute;right:-70px;top:-70px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(105,13,39,.6),transparent 68%);pointer-events:none}
button,input{font-family:inherit}
:focus-visible{outline:3px solid rgba(105,13,39,.3);outline-offset:2px}
.is-hidden{display:none!important}
.screen{position:relative;z-index:1;width:100%;max-width:400px;padding:calc(48px + env(safe-area-inset-top,0px)) 0 32px}
.hero{margin:0 4px 26px;color:#fff}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;background:var(--brand);font-size:20px;font-weight:800;box-shadow:0 6px 16px rgba(105,13,39,.4)}
.brand b{display:block;font-size:18px;font-weight:800;letter-spacing:-.3px}
.brand span{display:block;margin-top:1px;font-size:13px;color:rgba(255,255,255,.7)}
.headline{margin:26px 0 8px;font-size:32px;line-height:1.1;font-weight:800;letter-spacing:-1px}
.subhead{margin:0;font-size:15px;line-height:1.5;color:rgba(255,255,255,.8)}
.card{padding:22px 20px 20px;border-radius:24px;background:#fff;box-shadow:0 18px 50px rgba(20,10,20,.2)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin-bottom:20px;border-radius:14px;background:var(--page)}
.tab{height:42px;border:0;border-radius:11px;background:transparent;color:var(--soft);font-size:14px;font-weight:700;cursor:pointer;transition:background .15s,color .15s}
.tab.is-active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(20,20,30,.12)}
.field{margin-bottom:18px}
.field label{display:block;margin-bottom:8px;font-size:13px;font-weight:700}
.field input{width:100%;height:54px;padding:0 14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-size:16px;font-weight:600;transition:border-color .15s,box-shadow .15s}
.field input::placeholder{color:#A79C8A;font-weight:500}
.field input:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 4px rgba(105,13,39,.12)}
.field input:disabled{opacity:.7}
.password-wrap{position:relative}
.password-wrap input{padding-right:50px}
.toggle-visibility{position:absolute;right:4px;top:50%;transform:translateY(-50%);display:flex;padding:11px;border:0;background:none;color:var(--soft);cursor:pointer}
.error-banner{margin-bottom:16px;padding:12px 14px;border-radius:12px;background:var(--danger-bg);color:var(--danger);font-size:14px;font-weight:600;line-height:1.45}
.apply-cta{margin-top:20px;padding-top:20px;border-top:1px solid var(--line);text-align:center}
.apply-cta p{margin:0 0 12px;font-size:13px;line-height:1.5;color:var(--soft)}
.apply-cta a{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:14px;border:1.5px solid var(--brand);background:#fff;color:var(--brand);font-size:15px;font-weight:800;text-decoration:none}
.apply-cta a:active{transform:scale(.99)}
.status-hint{margin:0 0 16px;padding:12px 14px;border-radius:12px;background:#FAF5E8;color:var(--soft);font-size:13px;font-weight:600;line-height:1.5}
.status-hint a{color:var(--brand);font-weight:800}
.submit-btn{width:100%;height:56px;display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:14px;background:var(--brand);color:#fff;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 8px 18px rgba(105,13,39,.28);transition:transform .08s,background .15s}
.submit-btn:hover{background:var(--brand-dark)}
.submit-btn:active{transform:scale(.98)}
.submit-btn:disabled{opacity:.7;cursor:wait;transform:none}
.btn-spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.footnote{margin:18px 0 0;text-align:center;font-size:13px;line-height:1.5;color:var(--soft)}
@media (prefers-reduced-motion:reduce){.btn-spinner{animation:none}}
</style>
</head>
<body>

  <div class="screen">

    <div class="hero">
      <div class="brand">
        <span class="brand-mark">E</span>
        <div><b>Eatswada</b><span>Rider</span></div>
      </div>
      <h1 class="headline">Start your shift</h1>
      <p class="subhead">Log in to see today's deliveries.</p>
    </div>

    <main class="card">

      <div class="tabs" role="tablist" aria-label="Login method">
        <button type="button" class="tab is-active" id="tab-phone" role="tab" aria-selected="true">Phone</button>
        <button type="button" class="tab" id="tab-email" role="tab" aria-selected="false">Email</button>
      </div>

      <form id="login-form" novalidate>

        <div class="field" id="field-phone">
          <label for="phone">Phone number</label>
          <input type="tel" id="phone" name="phone" inputmode="numeric" autocomplete="tel" placeholder="98765 43210" />
        </div>

        <div class="field is-hidden" id="field-email">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="username" placeholder="you@example.com" />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" />
            <button type="button" class="toggle-visibility" id="toggle-password" aria-label="Show password">
              <svg id="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="error-banner is-hidden" id="error-banner" role="alert"></div>

        <div class="status-hint is-hidden" id="status-hint" role="status"></div>

        <button type="submit" class="submit-btn" id="submit-btn">
          <span class="btn-label">Log in</span>
          <span class="btn-spinner is-hidden" id="btn-spinner"></span>
        </button>

      </form>

      <div class="apply-cta">
        <p>New to Eatswada? Apply to become a delivery partner. An admin reviews every application before your rider account is created.</p>
        <a href="./apply.html">
          Become a Delivery Partner
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </a>
      </div>

      <p class="footnote">Can't log in? Contact your Eatswada dispatcher.</p>

    </main>

  </div>

  <script>
(() => {
  "use strict";

  // If the frontend is ever served from a different origin than the API
  // (e.g. static file during local dev while the API runs on another port),
  // change this to the full API origin, e.g. "http://localhost:5000".
  const API_BASE = "https://api.eatswada.com";
  const LOGIN_ENDPOINT = `${API_BASE}/api/auth/rider/login`;

  const REDIRECT_ON_SUCCESS = "index.html"; // built in the next step

  const form = document.getElementById("login-form");
  const tabPhone = document.getElementById("tab-phone");
  const tabEmail = document.getElementById("tab-email");
  const fieldPhone = document.getElementById("field-phone");
  const fieldEmail = document.getElementById("field-email");
  const phoneInput = document.getElementById("phone");
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const togglePasswordBtn = document.getElementById("toggle-password");
  const eyeIcon = document.getElementById("eye-icon");
  const errorBanner = document.getElementById("error-banner");
  const statusHint = document.getElementById("status-hint");
  const submitBtn = document.getElementById("submit-btn");
  const btnLabel = submitBtn.querySelector(".btn-label");
  const btnSpinner = document.getElementById("btn-spinner");

  let activeMethod = "phone"; // "phone" | "email"

  // ---------- Tab switching ----------
  function setMethod(method) {
    activeMethod = method;
    const isPhone = method === "phone";

    tabPhone.classList.toggle("is-active", isPhone);
    tabEmail.classList.toggle("is-active", !isPhone);
    tabPhone.setAttribute("aria-selected", String(isPhone));
    tabEmail.setAttribute("aria-selected", String(!isPhone));

    fieldPhone.classList.toggle("is-hidden", !isPhone);
    fieldEmail.classList.toggle("is-hidden", isPhone);

    hideError();
  }

  tabPhone.addEventListener("click", () => setMethod("phone"));
  tabEmail.addEventListener("click", () => setMethod("email"));

  // ---------- Password visibility ----------
  togglePasswordBtn.addEventListener("click", () => {
    const isPassword = passwordInput.type === "password";
    passwordInput.type = isPassword ? "text" : "password";
    togglePasswordBtn.setAttribute(
      "aria-label",
      isPassword ? "Hide password" : "Show password"
    );
    eyeIcon.style.opacity = isPassword ? "1" : "0.6";
  });

  // ---------- Error banner ----------
  function showError(message) {
    errorBanner.textContent = message;
    errorBanner.classList.remove("is-hidden");
  }

  function hideError() {
    errorBanner.classList.add("is-hidden");
    errorBanner.textContent = "";
  }

  // ---------- Pending application guidance ----------
  // If this device recently submitted a rider application, surface a clear
  // path to its status instead of leaving the applicant stuck on "Invalid
  // credentials" while their application is still awaiting admin review.
  function showStatusHint(message) {
    statusHint.innerHTML = message;
    statusHint.classList.remove("is-hidden");
  }

  function loadApplicationRef() {
    try {
      const raw = localStorage.getItem("eatswada_rider_application");
      if (!raw) return null;
      const ref = JSON.parse(raw);
      if (!ref || !ref.id || !ref.phone) return null;
      return ref;
    } catch {
      return null;
    }
  }

  (function initApplicationHint() {
    const ref = loadApplicationRef();
    if (!ref) return;
    const statusWord = ref.status === "approved" ? "approved" : "awaiting review";
    showStatusHint(
      "You have an application on this device (" + statusWord + "). " +
        '<a href="./apply.html" id="hint-status-link">Check your application status</a>.'
    );
    if (activeMethod === "phone") phoneInput.value = ref.phone;
  })();

  // ---------- Loading state ----------
  function setLoading(isLoading) {
    submitBtn.disabled = isLoading;
    phoneInput.disabled = isLoading;
    emailInput.disabled = isLoading;
    passwordInput.disabled = isLoading;
    btnLabel.textContent = isLoading ? "Logging in…" : "Log in";
    btnSpinner.classList.toggle("is-hidden", !isLoading);
  }

  // ---------- Client-side validation ----------
  function validate() {
    const password = passwordInput.value.trim();

    if (activeMethod === "phone") {
      const phone = phoneInput.value.trim();
      if (!phone) return "Enter your phone number.";
    } else {
      const email = emailInput.value.trim();
      if (!email) return "Enter your email.";
      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailPattern.test(email)) return "Enter a valid email address.";
    }

    if (!password) return "Enter your password.";
    return null;
  }

  // ---------- Submit ----------
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    hideError();

    const validationError = validate();
    if (validationError) {
      showError(validationError);
      return;
    }

    const payload = { password: passwordInput.value.trim() };
    if (activeMethod === "phone") {
      payload.phone = phoneInput.value.trim();
    } else {
      payload.email = emailInput.value.trim();
    }

    setLoading(true);

    try {
      const res = await fetch(LOGIN_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });

      let data;
      try {
        data = await res.json();
      } catch {
        throw new Error("Unexpected response from the server.");
      }

      if (!res.ok || !data.success) {
        let message = data.message || "Something went wrong. Please try again.";
        // Keep the backend message authoritative, but when the applicant has a
        // pending application on this device, point them at its status rather
        // than leaving a generic "Invalid credentials" dead end.
        const ref = loadApplicationRef();
        if (ref && res.status === 401) {
          message += " If you applied to become a delivery partner, your account is created only after an admin approves it — check your application status.";
        }
        showError(message);
        setLoading(false);
        return;
      }

      // Persist session for the dashboard and later screens.
      localStorage.setItem("riderToken", data.token);
      localStorage.setItem("riderUser", JSON.stringify(data.user));

      window.location.href = REDIRECT_ON_SUCCESS;
    } catch (err) {
      showError(
        err.message === "Failed to fetch"
          ? "Can't reach the server. Check your connection and try again."
          : err.message || "Something went wrong. Please try again."
      );
      setLoading(false);
    }
  });

  // If a rider is already logged in, skip straight to the dashboard.
  if (localStorage.getItem("riderToken")) {
    window.location.href = REDIRECT_ON_SUCCESS;
  }
})();

</script>
</body>
</html>
